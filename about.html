<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/about.css" />
    <title>Price Doubler App</title>
  </head>
  <body>
    <div class="about-page">
      <div class="title-btn">
        <div class="title-sec">
          <h1>About</h1>
          <p>PRICE DOUBLER</p>
        </div>

        <button class="close-btn" aria-label="Return to calculator">
          &times;
        </button>
      </div>

      <div class="price-content">
        <img
          src="https://tse2.mm.bing.net/th/id/OIP.WtY5JW62NFO0zVm-dQgNXQHaI1?r=0&pid=Api&h=220&P=0"
          alt="Image of a Calculator" />

        <div class="para">
          <h2>What is Price Doubler?</h2>
          <p>
            Price Doubler is a simple and easy to use tool that<br />helps you
            double prices quickly and accurately
          </p>
        </div>
      </div>
      <div class="info">
        <h3>How it Works</h3>
      </div>
      <div class="cards">
        <div class="card-1">
          <img
            class="logo-number"
            src="https://tse3.mm.bing.net/th/id/OIP.Nr3CIdoNfat2uEuz4_4kQAHaHa?r=0&pid=Api&h=220&P=0"
            alt="logo of number 1" />
          <img
            class="logo-text"
            src="https://tse2.mm.bing.net/th/id/OIP.CPtb2urOQXA5CryB2gOIcgHaHa?r=0&pid=Api&h=220&P=0"
            alt="Logo of text box" />
          <p>Enter one or more prices separated by commas.</p>
        </div>

        <div class="card-2">
          <img
            class="logo-number"
            src="https://tse3.mm.bing.net/th/id/OIP.4fw3KqEZmRqD7kdHLjFg6gHaGE?r=0&pid=Api&h=220&P=0"
            alt="logo of number 2" />
          <img
            class="logo-sun"
            src="https://tse3.mm.bing.net/th/id/OIP.biDqq8EYvkq3ucbCX63TMAHaHa?r=0&pid=Api&h=220&P=0"
            alt="Logo of sun" />
          <p>Click the Double Prices button to calculate.</p>
        </div>

        <div class="card-3">
          <img
            class="logo-number"
            src="https://tse2.mm.bing.net/th/id/OIP.1R5pY-sV4AckKHGHRnuRqAHaHa?r=0&pid=Api&h=220&P=0"
            alt="logo of number 3" />
          <img
            class="logo-multiply"
            src="https://tse3.mm.bing.net/th/id/OIP.YnFoepJJz5VjH88l5ZeA3wHaJ4?r=0&pid=Api&h=220&P=0"
            alt="Logo of x2" />
          <p>See your doubled prices displayed as results.</p>
        </div>
      </div>
    </div>
    <script src="js/about.js"></script>
  </body>
</html>
